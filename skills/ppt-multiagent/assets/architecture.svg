<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3B82F6"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#EF4444"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22C55E"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="420" fill="#FAFBFC" rx="8"/>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#1E293B">多智能体流水线架构</text>

  <!-- User node -->
  <rect x="290" y="42" width="100" height="32" rx="16" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="340" y="63" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#475569">用户需求</text>

  <!-- Arrow User → Steward -->
  <line x1="340" y1="74" x2="340" y2="86" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Steward (管家) -->
  <rect x="220" y="88" width="240" height="48" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="340" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">管家 (Steward)</text>
  <text x="340" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748B">需求解析 · 大纲确认 · 流水线调度 · 进度汇报</text>

  <!-- Arrow Steward → Pipeline -->
  <line x1="340" y1="136" x2="340" y2="152" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="350" y="148" font-family="system-ui,sans-serif" font-size="9" fill="#64748B">串行触发</text>

  <!-- Pipeline container -->
  <rect x="40" y="154" width="600" height="80" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="60" y="172" font-family="system-ui,sans-serif" font-size="10" font-weight="bold" fill="#94A3B8">工作者流水线</text>

  <!-- Agent-A -->
  <rect x="55" y="182" width="170" height="42" rx="5" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="140" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#92400E">Agent-A</text>
  <text x="140" y="216" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A16207">风格判定</text>

  <!-- A → B arrow -->
  <line x1="225" y1="203" x2="255" y2="203" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Agent-B -->
  <rect x="258" y="182" width="170" height="42" rx="5" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="343" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#92400E">Agent-B</text>
  <text x="343" y="216" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A16207">视觉采集</text>

  <!-- B → C arrow -->
  <line x1="428" y1="203" x2="458" y2="203" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Agent-C -->
  <rect x="461" y="182" width="170" height="42" rx="5" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="546" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#92400E">Agent-C</text>
  <text x="546" y="216" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A16207">内容融合</text>

  <!-- IO labels under pipeline -->
  <text x="140" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#94A3B8">输出: style_profile</text>
  <text x="343" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#94A3B8">输出: visual_assets</text>
  <text x="546" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#94A3B8">输出: output.pptx</text>

  <!-- Arrow Pipeline → Supervisor -->
  <line x1="340" y1="234" x2="340" y2="258" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Supervisor -->
  <rect x="230" y="260" width="220" height="42" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="340" y="278" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#991B1B">监督 (Supervisor)</text>
  <text x="340" y="294" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#B91C1C">多维度评分 · 定向退回 · 通过裁决</text>

  <!-- Pass arrow -->
  <line x1="340" y1="302" x2="340" y2="328" stroke="#22C55E" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="355" y="318" font-family="system-ui,sans-serif" font-size="9" fill="#22C55E" font-weight="bold">通过</text>

  <!-- Delivery node -->
  <rect x="280" y="330" width="120" height="30" rx="15" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.5"/>
  <text x="340" y="350" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#166534">交付用户</text>

  <!-- Retry arrow (back) -->
  <path d="M230,281 L60,281 L60,203 L55,203" fill="none" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="100" y="275" font-family="system-ui,sans-serif" font-size="8" fill="#EF4444">退回重做 (≤ MAX_RETRY)</text>

  <!-- Legend -->
  <rect x="40" y="370" width="600" height="40" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="55" y="394" font-family="system-ui,sans-serif" font-size="9" fill="#64748B">图例：</text>
  <rect x="95" y="382" width="30" height="14" rx="3" fill="#DBEAFE" stroke="#3B82F6" stroke-width="0.5"/>
  <text x="130" y="394" font-family="system-ui,sans-serif" font-size="9" fill="#64748B">管家</text>
  <rect x="170" y="382" width="30" height="14" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="0.5"/>
  <text x="205" y="394" font-family="system-ui,sans-serif" font-size="9" fill="#64748B">工作者</text>
  <rect x="250" y="382" width="30" height="14" rx="3" fill="#FEE2E2" stroke="#EF4444" stroke-width="0.5"/>
  <text x="285" y="394" font-family="system-ui,sans-serif" font-size="9" fill="#64748B">监督</text>
  <line x1="340" y1="389" x2="370" y2="389" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="375" y="394" font-family="system-ui,sans-serif" font-size="9" fill="#64748B">退回路径</text>
  <line x1="440" y1="389" x2="470" y2="389" stroke="#22C55E" stroke-width="2"/>
  <text x="475" y="394" font-family="system-ui,sans-serif" font-size="9" fill="#64748B">正常流程</text>
</svg>